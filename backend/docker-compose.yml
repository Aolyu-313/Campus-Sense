services:
  mysql:
    image: mysql:8.0
    container_name: campussense-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campussense
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - campussense_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  campussense_mysql_data:
