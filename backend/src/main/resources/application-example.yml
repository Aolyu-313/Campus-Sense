server:
  address: 0.0.0.0
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campussense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: your_mysql_password
  jpa:
    hibernate:
      ddl-auto: update

campussense:
  external:
    # QWeather is used for air quality; AMap is used for reverse geocoding and weatherInfo weather.
    qweather-api-key: your_qweather_api_key
    amap-api-key: your_amap_webservice_api_key
    cache-enabled: true
